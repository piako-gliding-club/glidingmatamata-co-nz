{{- with .Params.cta }}
<div class="bg-navy rounded-[20px] p-6 md:p-10 flex flex-wrap gap-x-10 gap-y-5 items-center justify-between">
  <div>
    <div class="font-head font-bold text-[clamp(24px,3vw,32px)] tracking-[-0.02em] text-white">{{ .title }}</div>
    {{ with .text }}<p class="mt-1.5 text-[#dbe5f0]">{{ . }}</p>{{ end }}
  </div>
  <a href="{{ .url | relURL }}" {{ if hasPrefix .url "http" }}target="_blank" rel="noopener"{{ end }} class="btn-gold whitespace-nowrap">{{ .button }}</a>
</div>
{{- end }}

<div class="grid md:grid-cols-3 gap-[18px]">
  {{- range hugo.Data.trial_flights.flights }}
  <div class="card p-7 flex flex-col {{ if .popular }}!border-gold border-2 relative{{ end }}">
    {{- if .popular }}<span class="absolute -top-3 left-6 font-mono text-[11px] tracking-[0.14em] uppercase bg-gold text-deep px-2.5 py-1 rounded-full">Most popular</span>{{ end }}
    <div class="eyebrow">{{ .name }} · {{ .height }}</div>
    <div class="mt-3 font-head font-bold text-[44px] leading-none text-navy">${{ .price }}</div>
    <div class="mt-2 font-mono text-sm text-label">{{ .duration }}</div>
    <p class="mt-4 text-[15px] text-muted leading-normal">{{ .description }}</p>
  </div>
  {{- end }}
</div>

{{- $s := hugo.Data.settings -}}
<dl class="mt-3 card divide-y divide-line">
  {{- range slice (slice "Account name" $s.bank_account_name) (slice "Account number" $s.bank_account_number) }}
  <div class="flex items-center justify-between gap-4 px-5 py-3.5">
    <div><dt class="text-sm text-muted">{{ index . 0 }}</dt><dd class="font-semibold text-navy">{{ index . 1 }}</dd></div>
    <button type="button" data-copy="{{ index . 1 }}" aria-label="Copy {{ lower (index . 0) }}" class="flex-none rounded-lg border-[1.5px] border-navy px-3.5 py-1.5 text-sm font-semibold text-navy hover:bg-navy hover:text-white">Copy</button>
  </div>
  {{- end }}
</dl>
<script>
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.copy).then(() => {
    b.textContent = 'Copied ✓';
    setTimeout(() => { b.textContent = 'Copy'; }, 2000);
  });
});
</script>

{{ define "main" }}
<div class="max-w-[760px] mx-auto px-5 md:px-8 pt-10 md:pt-16 pb-24">
  <h1 class="font-head font-bold text-[clamp(34px,5.4vw,56px)] leading-[1.05] tracking-[-0.02em] text-navy">{{ .Params.heading | default .Title }}</h1>
  {{ with .Params.intro }}<p class="mt-4 text-lg text-body prose-links">{{ . | markdownify }}</p>{{ end }}
  {{- range .Params.rows }}
  <h2 class="mt-10 font-head font-bold text-2xl text-navy">{{ .title }}</h2>
  <div class="mt-2 text-body prose-links [&_p+p]:mt-3 [&_ul]:list-disc [&_ul]:pl-5 [&_li+li]:mt-1.5 [&_strong]:text-navy">{{ .text | markdownify }}</div>
  {{- end }}
</div>
{{ end }}

{{ define "main" }}
{{ partial "page-head.html" . }}
<div class="max-w-[1100px] mx-auto px-5 md:px-16 pb-20">
  <div class="mt-8 md:mt-11">{{ partial "cta.html" . }}</div>
  <div class="mt-6 md:mt-8 border-t border-line">
    {{- range .Pages.ByWeight }}
    <a href="{{ .RelPermalink }}" class="grid md:grid-cols-3 gap-x-10 gap-y-2 items-start py-7 border-b border-line hover:bg-[#f5f8fb]">
      <div>
        <div class="font-head font-bold text-[clamp(24px,3vw,30px)] leading-tight tracking-[-0.02em] text-navy">{{ .Title }}</div>
        <div class="mt-1.5 text-body">{{ .Params.summary }}</div>
      </div>
      <div class="md:col-span-2 flex justify-between gap-5 items-center">
        <span class="font-mono text-xs leading-relaxed text-label">{{ $t := slice }}{{ range .Params.groups }}{{ $t = $t | append .title }}{{ end }}{{ delimit $t " · " }}</span>
        <span class="flex-none text-gold text-[26px]" aria-hidden="true">→</span>
      </div>
    </a>
    {{- end }}
  </div>
</div>
{{ end }}
